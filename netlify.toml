[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
# PUBLIC_API_URL et PUBLIC_API_KEY (clé anon de Supabase) : à définir dans l'interface Netlify.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
